spring.application.name=business-service

server.port=8082

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/autocart_db
spring.datasource.username=root
spring.datasource.password=vedant

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka (Disabled for standalone execution)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# JWT Configuration
jwt.secret=AutoCartAuthenticationServiceSecureJwtSecretKey2026ForSigningTokens